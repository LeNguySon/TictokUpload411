[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tavm"
version = "2.0.0"
description = "TikTok Account & Video Manager for Windows 11 (Clean Architecture & Fluent Design)"
authors = [{ name = "TAVM Engineering Team", email = "developer@tavm.local" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.8.0",
    "PyQt6-Fluent-Widgets>=1.7.0",
    "pydantic>=2.10.0",
    "requests>=2.32.0",
    "curl_cffi>=0.7.0",
    "keyring>=24.3.0",
    "cryptography>=44.0.0",
    "pywin32>=308",
    "geoip2>=4.8.0",
    "psutil>=5.9.0",
    "websockets>=12.0",  # DevTools access to running browsers (session renewal)
    # Private SDK, not on PyPI: install from vendor/ (pip install --find-links vendor ...)
    "sammonny==1.8.3",
]

[tool.pytest.ini_options]
minversion = "8.0"
qt_api = "pyqt6"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true

